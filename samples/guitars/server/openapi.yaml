openapi: 3.0.3
info:
  title: Guitars Service API
  version: "1.0.0"
  description: API for managing guitars, users, and login operations.
servers:
  - url: http://localhost:5000
paths:
  /:
    get:
      summary: Root greeting
      responses:
        '200':
          description: HTML greeting message
          content:
            text/html:
              schema:
                type: string
  /index:
    get:
      summary: Index page
      responses:
        '200':
          description: HTML index page
          content:
            text/html:
              schema:
                type: string
  /guitars:
    get:
      summary: Retrieve all guitars
      responses:
        '200':
          description: A list of guitars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guitar'
    post:
      summary: Create a new guitar
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewGuitar'
      responses:
        '201':
          description: Guitar created successfully
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid request data
          content:
            text/plain:
              schema:
                type: string
  /guitars/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    delete:
      summary: Delete a guitar by ID
      responses:
        '200':
          description: Guitar deleted successfully
          content:
            text/plain:
              schema:
                type: string
    options:
      summary: Preflight request for guitar item operations
      responses:
        '204':
          description: Preflight response with CORS headers
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
  /users:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User registered successfully
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Missing or invalid user data
          content:
            text/plain:
              schema:
                type: string
        '409':
          description: User already exists
          content:
            text/plain:
              schema:
                type: string
  /login:
    post:
      summary: Login stub endpoint
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login request received
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Missing username or password
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Guitar:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
          format: float
        rating:
          type: integer
      required:
        - id
        - name
        - price
        - rating
    NewGuitar:
      type: object
      properties:
        name:
          type: string
        rating:
          type: integer
          format: int32
          minimum: 0
          maximum: 10
        price:
          type: number
          format: float
      required:
        - name
        - rating
        - price
    UserRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
