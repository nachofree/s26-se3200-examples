<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <button id="add_guitar_btn" class="add-guitar-btn">+ Add Guitar</button>
    <button id="add_user_btn" class="add-guitar-btn">+ Add User</button>
    <button id="login_btn" class="add-guitar-btn">Login</button>
    <button id="logout_btn" class="add-guitar-btn">Logout</button>
    
    <div id="guitar_grid">

    </div>
    
    <div id="guitar_modal" class="modal">
        <div class="modal-content">
            <h2>Add New Guitar</h2>
            <form id="guitar_form">
                <div class="form-group">
                    <label for="guitar_name">Name:</label>
                    <input type="text" id="guitar_name" required>
                </div>
                <div class="form-group">
                    <label for="guitar_price">Price:</label>
                    <input type="number" id="guitar_price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="guitar_rating">Rating:</label>
                    <input type="number" id="guitar_rating" min="0" max="10" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" id="cancel_btn" class="btn-cancel">Cancel</button>
                    <button type="button" id="add_btn" class="btn-add">Add</button>
                </div>
            </form>
        </div>
    </div>

    <div id="user_modal" class="modal">
        <div class="modal-content">
            <h2>User Registration</h2>
            <form id="user_form">
                <div class="form-group">
                    <label for="user_email">Email:</label>
                    <input type="email" id="user_email" required>
                </div>
                <div class="form-group">
                    <label for="user_password">Password:</label>
                    <input type="password" id="user_password" required>
                </div>
                <div class="form-group">
                    <label for="user_confirm_password">Confirm Password:</label>
                    <input type="password" id="user_confirm_password" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" id="user_cancel_btn" class="btn-cancel">Cancel</button>
                    <button type="button" id="user_register_btn" class="btn-add">Register</button>
                </div>
            </form>
        </div>
    </div> 

    <!-- Modal for login -->
    <div id="login_modal" class="modal">
        <div class="modal-content">
            <h2>Login</h2>
            <form id="login_form">
                <div class="form-group">
                    <label for="login_email">Email:</label>
                    <input type="text" id="login_email" required>
                </div>
                <div class="form-group">
                    <label for="login_password">Password:</label>
                    <input type="password" id="login_password" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" id="login_cancel_btn" class="btn-cancel">Cancel</button>
                    <button type="button" id="login_submit_btn" class="btn-add">Login</button>
                </div>
            </form>
        </div>
    </div>
</body>
<script src="app.js"></script>
</html>
